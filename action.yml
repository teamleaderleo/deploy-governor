name: Deploy Governor
description: Deploy a Vercel production commit immediately below the rolling threshold, otherwise leave it for the global batch scheduler.
inputs:
  vercel-token:
    description: Vercel API token with access to the target team.
    required: true
  team-slug:
    description: Vercel team slug.
    required: true
  vercel-project:
    description: Vercel project name.
    required: true
  vercel-project-id:
    description: Vercel project ID (prj_...).
    required: true
  repo:
    description: GitHub repository in owner/name form.
    required: false
    default: ${{ github.repository }}
  branch:
    description: Git branch deployed to production.
    required: false
    default: main
  sha:
    description: Exact Git commit to deploy.
    required: false
    default: ${{ github.sha }}
  threshold:
    description: Number of deployments in the rolling window before batching starts.
    required: false
    default: '50'
  window-hours:
    description: Rolling window length in hours.
    required: false
    default: '24'
  dry-run:
    description: Evaluate without creating a deployment.
    required: false
    default: 'false'
outputs:
  action:
    description: deploy-now, batch-wait, or already-current.
    value: ${{ steps.govern.outputs.action }}
  deployment-id:
    description: Created Vercel deployment ID, when one was created.
    value: ${{ steps.govern.outputs.deployment-id }}
  deployment-count:
    description: Observed deployment count, capped at the threshold.
    value: ${{ steps.govern.outputs.deployment-count }}
runs:
  using: composite
  steps:
    - id: govern
      shell: bash
      env:
        VERCEL_TOKEN: ${{ inputs.vercel-token }}
      run: >-
        node "$GITHUB_ACTION_PATH/bin/deploy-governor.mjs" push
        --team-slug "${{ inputs.team-slug }}"
        --vercel-project "${{ inputs.vercel-project }}"
        --vercel-project-id "${{ inputs.vercel-project-id }}"
        --repo "${{ inputs.repo }}"
        --branch "${{ inputs.branch }}"
        --sha "${{ inputs.sha }}"
        --threshold "${{ inputs.threshold }}"
        --window-hours "${{ inputs.window-hours }}"
        ${{ inputs.dry-run == 'true' && '--dry-run' || '' }}

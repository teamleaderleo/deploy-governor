name: Vercel Git repository metadata probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vercel-git-head-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect Vercel Git integration metadata for private repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          payload="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            'https://api.vercel.com/v1/integrations/search-repo?provider=github&query=make-good-tv&slug=leo-lis-projects')"

          jq '{
            topLevelKeys: keys,
            repoCount: ((.repos // []) | length),
            repoKeys: ([.repos[]? | keys] | add | unique),
            matching: [
              .repos[]? |
              with_entries(select(.key | test("sha|commit|branch|name|slug|id|private|url|owner|org"; "i")))
            ]
          }' <<<"$payload" >/tmp/receipt.json

          encoded="$(base64 -w 0 </tmp/receipt.json)"
          path='.smoke/vercel-git-repo.json'
          existing_sha="$(gh api "/repos/$REPOSITORY/contents/$path" --jq '.sha' 2>/dev/null || true)"
          args=(--method PUT "/repos/$REPOSITORY/contents/$path" -f message='Record Vercel Git repository metadata probe' -f content="$encoded")
          if [[ -n "$existing_sha" ]]; then args+=(-f sha="$existing_sha"); fi
          gh api "${args[@]}" >/dev/null

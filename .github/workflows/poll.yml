name: Poll governed production heads

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/poll.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: Evaluate without dispatching candidates
        type: boolean
        default: true

permissions:
  actions: read
  contents: write

concurrency:
  group: deploy-governor-head-poll
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Require governor credential
        if: env.VERCEL_TOKEN == ''
        run: |
          echo 'VERCEL_TOKEN is not configured.' >&2
          exit 1
      - name: Reconcile production heads into candidate events
        run: >-
          node bin/deploy-governor.mjs poll --config projects.json
          ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}

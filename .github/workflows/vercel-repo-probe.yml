name: Vercel repo probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vercel-repo-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect linked Scrapbook repository metadata after preview probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          payload="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            'https://api.vercel.com/v1/integrations/search-repo?provider=github&slug=leo-lis-projects&query=scrapbook')"
          repo="$(jq -c '[.repos[]? | select(((.namespace + "/" + .slug) | ascii_downcase) == "teamleaderleo/scrapbook")][0] // null' <<<"$payload")"
          if [[ "$repo" == "null" ]]; then
            echo 'Scrapbook was not returned by Vercel Git integration.' >&2
            jq '{gitAccount, repos: [.repos[]? | {id, provider, name, slug, namespace, private, defaultBranch, updatedAt}]}' <<<"$payload" >&2
            exit 1
          fi
          receipt="$(jq -n --argjson repo "$repo" '{repo: $repo}')"
          encoded="$(printf '%s\n' "$receipt" | base64 -w 0)"
          path='.smoke/vercel-repo.json'
          existing_sha="$(gh api "/repos/$REPOSITORY/contents/$path" --jq '.sha' 2>/dev/null || true)"
          args=(--method PUT "/repos/$REPOSITORY/contents/$path" -f message='Record Vercel repo probe' -f content="$encoded")
          if [[ -n "$existing_sha" ]]; then args+=(-f sha="$existing_sha"); fi
          gh api "${args[@]}" >/dev/null

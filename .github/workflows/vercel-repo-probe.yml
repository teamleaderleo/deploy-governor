name: Vercel project discovery probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vercel-repo-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect Vercel project Git links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          payload="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H 'Content-Type: application/json' \
            'https://api.vercel.com/v9/projects?limit=100&slug=leo-lis-projects')"
          receipt="$(jq '{projects: [.projects[]? | {id, name, framework, rootDirectory, link}]}' <<<"$payload")"
          encoded="$(printf '%s\n' "$receipt" | base64 -w 0)"
          path='.smoke/vercel-projects.json'
          existing_sha="$(gh api "/repos/$REPOSITORY/contents/$path" --jq '.sha' 2>/dev/null || true)"
          args=(--method PUT "/repos/$REPOSITORY/contents/$path" -f message='Record Vercel project discovery probe' -f content="$encoded")
          if [[ -n "$existing_sha" ]]; then args+=(-f sha="$existing_sha"); fi
          gh api "${args[@]}" >/dev/null

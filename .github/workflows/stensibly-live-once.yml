name: Stensibly live revision once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stensibly-live-once.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record live OIDC Worker revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -D /tmp/headers -o /tmp/body https://api.stensibly.com/health
          tag="$(awk 'BEGIN{IGNORECASE=1} /^x-stensibly-worker-version-tag:/ {gsub("\r", ""); sub(/^[^:]*:[[:space:]]*/, ""); print; exit}' /tmp/headers)"
          id="$(awk 'BEGIN{IGNORECASE=1} /^x-stensibly-worker-version-id:/ {gsub("\r", ""); sub(/^[^:]*:[[:space:]]*/, ""); print; exit}' /tmp/headers)"
          receipt="$(printf '{\n  \"workerVersionTag\": \"%s\",\n  \"workerVersionId\": \"%s\"\n}\n' "$tag" "$id")"
          encoded="$(printf '%s' "$receipt" | base64 -w 0)"
          path='.smoke/stensibly-live.json'
          existing_sha="$(gh api "/repos/$REPOSITORY/contents/$path" --jq '.sha' 2>/dev/null || true)"
          args=(--method PUT "/repos/$REPOSITORY/contents/$path" -f message='Record live Stensibly revision' -f content="$encoded")
          if [[ -n "$existing_sha" ]]; then args+=(-f sha="$existing_sha"); fi
          gh api "${args[@]}" >/dev/null

name: Receiver smoke

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/receiver-smoke.yml

permissions:
  actions: read
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      REPOSITORY: ${{ github.repository }}
      CANDIDATE_TITLE: candidate|teamleaderleo/scrapbook|main|8d4290ba153aa6f28ea6a70dab5c793b97d11cf4
    steps:
      - name: Dispatch and verify already-live Scrapbook SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$REPOSITORY/dispatches" \
            --input - <<'JSON'
          {
            "event_type": "vercel-deploy-candidate",
            "client_payload": {
              "repository": "teamleaderleo/scrapbook",
              "branch": "main",
              "sha": "8d4290ba153aa6f28ea6a70dab5c793b97d11cf4",
              "delivery_id": "receiver-smoke-2026-08-24"
            }
          }
          JSON

          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh api "/repos/$REPOSITORY/actions/workflows/candidate.yml/runs?event=repository_dispatch&per_page=20" \
              --jq ".workflow_runs[] | select(.display_title == \"$CANDIDATE_TITLE\") | .id" \
              | head -n 1)"
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          if [[ -z "$run_id" ]]; then
            echo 'Candidate workflow did not appear.' >&2
            exit 1
          fi

          gh run watch "$run_id" --repo "$REPOSITORY" --exit-status
          logs="$(gh run view "$run_id" --repo "$REPOSITORY" --log)"
          if ! grep -F '"action": "already-current"' <<<"$logs" >/dev/null; then
            echo 'Candidate did not reconcile as already-current.' >&2
            printf '%s\n' "$logs" >&2
            exit 1
          fi

          receipt="$(printf '{\n  \"candidateRunId\": %s,\n  \"repository\": \"teamleaderleo/scrapbook\",\n  \"branch\": \"main\",\n  \"sha\": \"8d4290ba153aa6f28ea6a70dab5c793b97d11cf4\",\n  \"result\": \"already-current\"\n}\n' "$run_id")"
          encoded="$(printf '%s' "$receipt" | base64 -w 0)"
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$REPOSITORY/contents/.smoke/receiver-smoke.json" \
            -f message='Record central receiver smoke' \
            -f content="$encoded" >/dev/null

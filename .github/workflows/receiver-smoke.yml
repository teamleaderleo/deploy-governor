name: Receiver smoke

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/receiver-smoke.yml

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch already-live Scrapbook SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/dispatches" \
            -d '{"event_type":"vercel-deploy-candidate","client_payload":{"repository":"teamleaderleo/scrapbook","branch":"main","sha":"8d4290ba153aa6f28ea6a70dab5c793b97d11cf4","delivery_id":"receiver-smoke-2026-08-24"}}'
